<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1825"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pocket League"><title>Pocket League — Car Football</title></head><body><canvas id="game" aria-label="Pocket League 3D arena"></canvas><div id="app"></div><section id="launchRecovery" hidden style="position:fixed;inset:0;z-index:999;background:#0b1825;color:#edf4e9;padding:32px;font:16px system-ui;overflow:auto"><h1>Pocket League could not start</h1><p id="launchReason">Loading took too long. An old offline copy or unavailable graphics support may be preventing startup.</p><button id="repairLaunch" style="padding:14px">Repair cached game and reload</button><p>Internet is required to repair. Your control settings will be kept.</p></section><script>
(()=>{const box=document.getElementById('launchRecovery');const fail=()=>{box.hidden=false;};const timer=setTimeout(()=>{if(!window.__pocketWaitingForStart&&!document.querySelector('#practice:not([disabled])')&&!document.querySelector('#fatal'))fail();},25000);window.addEventListener('error',e=>{if(e.target?.tagName==='SCRIPT')fail();},true);document.getElementById('repairLaunch').onclick=async()=>{const msg=document.getElementById('launchReason');if(!navigator.onLine){msg.textContent='Connect to the internet, then tap Repair again.';return;}try{if('serviceWorker'in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if('caches'in window)for(const k of await caches.keys())if(k.startsWith('pocket-'))await caches.delete(k);location.reload();}catch(e){msg.textContent='Repair failed. Open this website in your browser and refresh it. '+e.message;}};})();
</script><script type="module" src="/client/entry.js"></script></body></html>
